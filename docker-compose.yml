version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: djangoweb_db
    env_file:
      - env.development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - djangoweb_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  web:
    build: .
    container_name: djangoweb_web
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - env.development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - djangoweb_network
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:

networks:
  djangoweb_network:
    driver: bridge
